# OneStop - local runtime.
#
# One PostgreSQL instance hosts a separate database per service (the
# database-per-service boundary is logical here; a single container keeps local
# setup light). Each backend service is built from the shared multi-stage
# Dockerfile at infrastructure/docker/service.Dockerfile.
#
#   docker compose up --build
#
# Observability: Prometheus (metrics), Grafana (dashboards), Zipkin (tracing).

name: onestop

services:
  postgres:
    image: postgres:16-alpine
    container_name: onestop-postgres
    # Many services share this one instance; raise the connection ceiling so their
    # Hikari pools (10 each) don't exhaust the default max_connections of 100.
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_USER: onestop
      POSTGRES_PASSWORD: onestop
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onestop"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka-native:3.9.0
    container_name: onestop-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "9092:9092"

  redis:
    image: redis:7-alpine
    container_name: onestop-redis
    ports:
      - "6379:6379"

  # ---- Search engine (V3): Elasticsearch, single-node, security off for local ----
  elasticsearch:
    # Pulled from Elastic's own registry (Docker Hub's CDN mirror was unreliable
    # for this image). Single-node, security off — local/dev only.
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: onestop-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  # ---- Observability (Sprint 6) ----
  zipkin:
    image: openzipkin/zipkin-slim:3.4
    container_name: onestop-zipkin
    ports:
      - "9411:9411"

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: onestop-prometheus
    volumes:
      - ./infrastructure/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.2.0
    container_name: onestop-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./infrastructure/observability/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  identity-service:
    build:
      context: .
      dockerfile: infrastructure/docker/service.Dockerfile
      args:
        SERVICE: identity-service
    environment:
      SERVER_PORT: 8081
      DB_HOST: postgres
      DB_NAME: identity_db
      DB_USERNAME: onestop
      DB_PASSWORD: onestop
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  catalog-service:
    build:
      context: .
      dockerfile: infrastructure/docker/service.Dockerfile
      args:
        SERVICE: catalog-service
    environment:
      SERVER_PORT: 8082
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
      DB_HOST: postgres
      DB_NAME: catalog_db
      DB_USERNAME: onestop
      DB_PASSWORD: onestop
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  cart-service:
    build:
      context: .
      dockerfile: infrastructure/docker/service.Dockerfile
      args:
        SERVICE: cart-service
    environment:
      SERVER_PORT: 8083
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
      DB_HOST: postgres
      DB_NAME: cart_db
      DB_USERNAME: onestop
      DB_PASSWORD: onestop
      CATALOG_BASE_URL: http://catalog-service:8082
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy

  inventory-service:
    build:
      context: .
      dockerfile: infrastructure/docker/service.Dockerfile
      args:
        SERVICE: inventory-service
    environment:
      SERVER_PORT: 8084
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
      DB_HOST: postgres
      DB_NAME: inventory_db
      DB_USERNAME: onestop
      DB_PASSWORD: onestop
      INTERNAL_API_TOKEN: dev-internal-token-change-me
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy

  order-service:
    build:
      context: .
      dockerfile: infrastructure/docker/service.Dockerfile
      args:
        SERVICE: order-service
    environment:
      SERVER_PORT: 8085
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
      DB_HOST: postgres
      DB_NAME: order_db
      DB_USERNAME: onestop
      DB_PASSWORD: onestop
      CART_BASE_URL: http://cart-service:8083
      CATALOG_BASE_URL: http://catalog-service:8082
      INVENTORY_BASE_URL: http://inventory-service:8084
      COUPON_BASE_URL: http://coupon-service:8090
      PAYMENT_BASE_URL: http://payment-service:8091
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      INTERNAL_API_TOKEN: dev-internal-token-change-me
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  notification-service:
    build:
      context: .
      dockerfile: infrastructure/docker/service.Dockerfile
      args:
        SERVICE: notification-service
    environment:
      SERVER_PORT: 8086
      DB_HOST: postgres
      DB_NAME: notification_db
      DB_USERNAME: onestop
      DB_PASSWORD: onestop
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      INTERNAL_API_TOKEN: dev-internal-token-change-me
    ports:
      - "8086:8086"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  search-service:
    build:
      context: .
      dockerfile: infrastructure/docker/service.Dockerfile
      args:
        SERVICE: search-service
    environment:
      SERVER_PORT: 8087
      DB_HOST: postgres
      DB_NAME: search_db
      DB_USERNAME: onestop
      DB_PASSWORD: onestop
      CATALOG_BASE_URL: http://catalog-service:8082
      RECOMMENDATION_BASE_URL: http://recommendation-service:8096
      INTERNAL_API_TOKEN: dev-internal-token-change-me
      ELASTICSEARCH_URIS: http://elasticsearch:9200
      SEARCH_ENGINE: elasticsearch
      SEARCH_BEHAVIORAL_RANKING: "true"
    ports:
      - "8087:8087"
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  review-service:
    build:
      context: .
      dockerfile: infrastructure/docker/service.Dockerfile
      args:
        SERVICE: review-service
    environment:
      SERVER_PORT: 8088
      DB_HOST: postgres
      DB_NAME: review_db
      DB_USERNAME: onestop
      DB_PASSWORD: onestop
    ports:
      - "8088:8088"
    depends_on:
      postgres:
        condition: service_healthy

  wishlist-service:
    build:
      context: .
      dockerfile: infrastructure/docker/service.Dockerfile
      args:
        SERVICE: wishlist-service
    environment:
      SERVER_PORT: 8089
      DB_HOST: postgres
      DB_NAME: wishlist_db
      DB_USERNAME: onestop
      DB_PASSWORD: onestop
      CATALOG_BASE_URL: http://catalog-service:8082
    ports:
      - "8089:8089"
    depends_on:
      postgres:
        condition: service_healthy

  coupon-service:
    build:
      context: .
      dockerfile: infrastructure/docker/service.Dockerfile
      args:
        SERVICE: coupon-service
    environment:
      SERVER_PORT: 8090
      DB_HOST: postgres
      DB_NAME: coupon_db
      DB_USERNAME: onestop
      DB_PASSWORD: onestop
      INTERNAL_API_TOKEN: dev-internal-token-change-me
    ports:
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy

  payment-service:
    build:
      context: .
      dockerfile: infrastructure/docker/service.Dockerfile
      args:
        SERVICE: payment-service
    environment:
      SERVER_PORT: 8091
      DB_HOST: postgres
      DB_NAME: payment_db
      DB_USERNAME: onestop
      DB_PASSWORD: onestop
      INTERNAL_API_TOKEN: dev-internal-token-change-me
    ports:
      - "8091:8091"
    depends_on:
      postgres:
        condition: service_healthy

  address-service:
    build:
      context: .
      dockerfile: infrastructure/docker/service.Dockerfile
      args:
        SERVICE: address-service
    environment:
      SERVER_PORT: 8092
      DB_HOST: postgres
      DB_NAME: address_db
      DB_USERNAME: onestop
      DB_PASSWORD: onestop
    ports:
      - "8092:8092"
    depends_on:
      postgres:
        condition: service_healthy

  delivery-service:
    build:
      context: .
      dockerfile: infrastructure/docker/service.Dockerfile
      args:
        SERVICE: delivery-service
    environment:
      SERVER_PORT: 8093
      DB_HOST: postgres
      DB_NAME: delivery_db
      DB_USERNAME: onestop
      DB_PASSWORD: onestop
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8093:8093"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  admin-service:
    build:
      context: .
      dockerfile: infrastructure/docker/service.Dockerfile
      args:
        SERVICE: admin-service
    environment:
      SERVER_PORT: 8094
      CATALOG_BASE_URL: http://catalog-service:8082
      ORDER_BASE_URL: http://order-service:8085
      COUPON_BASE_URL: http://coupon-service:8090
      INTERNAL_API_TOKEN: dev-internal-token-change-me
    ports:
      - "8094:8094"

  activity-service:
    build:
      context: .
      dockerfile: infrastructure/docker/service.Dockerfile
      args:
        SERVICE: activity-service
    environment:
      SERVER_PORT: 8095
      DB_HOST: postgres
      DB_NAME: activity_db
      DB_USERNAME: onestop
      DB_PASSWORD: onestop
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
    ports:
      - "8095:8095"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  recommendation-service:
    build:
      context: .
      dockerfile: infrastructure/docker/service.Dockerfile
      args:
        SERVICE: recommendation-service
    environment:
      SERVER_PORT: 8096
      DB_HOST: postgres
      DB_NAME: recommendation_db
      DB_USERNAME: onestop
      DB_PASSWORD: onestop
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CATALOG_BASE_URL: http://catalog-service:8082
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
    ports:
      - "8096:8096"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  api-gateway:
    build:
      context: .
      dockerfile: infrastructure/docker/service.Dockerfile
      args:
        SERVICE: api-gateway
    environment:
      SERVER_PORT: 8080
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
      IDENTITY_URI: http://identity-service:8081
      CATALOG_URI: http://catalog-service:8082
      CART_URI: http://cart-service:8083
      ORDER_URI: http://order-service:8085
      INVENTORY_URI: http://inventory-service:8084
      SEARCH_URI: http://search-service:8087
      REVIEW_URI: http://review-service:8088
      WISHLIST_URI: http://wishlist-service:8089
      COUPON_URI: http://coupon-service:8090
      PAYMENT_URI: http://payment-service:8091
      ADDRESS_URI: http://address-service:8092
      DELIVERY_URI: http://delivery-service:8093
      ADMIN_URI: http://admin-service:8094
      ACTIVITY_URI: http://activity-service:8095
      RECOMMENDATION_URI: http://recommendation-service:8096
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      - identity-service
      - catalog-service
      - cart-service
      - order-service
      - search-service
      - review-service
      - wishlist-service
      - coupon-service
      - payment-service
      - address-service
      - delivery-service
      - admin-service

volumes:
  postgres-data:
