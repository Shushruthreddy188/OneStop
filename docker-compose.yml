# OneStop - local runtime.
#
# One PostgreSQL instance hosts a separate database per service (the
# database-per-service boundary is logical here; a single container keeps local
# setup light). Each backend service is built from the shared multi-stage
# Dockerfile at infrastructure/docker/service.Dockerfile.
#
#   docker compose up --build
#
# Observability is intentionally absent until a later milestone.

name: onestop

services:
  postgres:
    image: postgres:16-alpine
    container_name: onestop-postgres
    environment:
      POSTGRES_USER: onestop
      POSTGRES_PASSWORD: onestop
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onestop"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka-native:3.9.0
    container_name: onestop-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "9092:9092"

  identity-service:
    build:
      context: .
      dockerfile: infrastructure/docker/service.Dockerfile
      args:
        SERVICE: identity-service
    environment:
      SERVER_PORT: 8081
      DB_HOST: postgres
      DB_NAME: identity_db
      DB_USERNAME: onestop
      DB_PASSWORD: onestop
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  catalog-service:
    build:
      context: .
      dockerfile: infrastructure/docker/service.Dockerfile
      args:
        SERVICE: catalog-service
    environment:
      SERVER_PORT: 8082
      DB_HOST: postgres
      DB_NAME: catalog_db
      DB_USERNAME: onestop
      DB_PASSWORD: onestop
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy

  cart-service:
    build:
      context: .
      dockerfile: infrastructure/docker/service.Dockerfile
      args:
        SERVICE: cart-service
    environment:
      SERVER_PORT: 8083
      DB_HOST: postgres
      DB_NAME: cart_db
      DB_USERNAME: onestop
      DB_PASSWORD: onestop
      CATALOG_BASE_URL: http://catalog-service:8082
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy

  inventory-service:
    build:
      context: .
      dockerfile: infrastructure/docker/service.Dockerfile
      args:
        SERVICE: inventory-service
    environment:
      SERVER_PORT: 8084
      DB_HOST: postgres
      DB_NAME: inventory_db
      DB_USERNAME: onestop
      DB_PASSWORD: onestop
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy

  order-service:
    build:
      context: .
      dockerfile: infrastructure/docker/service.Dockerfile
      args:
        SERVICE: order-service
    environment:
      SERVER_PORT: 8085
      DB_HOST: postgres
      DB_NAME: order_db
      DB_USERNAME: onestop
      DB_PASSWORD: onestop
      CART_BASE_URL: http://cart-service:8083
      CATALOG_BASE_URL: http://catalog-service:8082
      INVENTORY_BASE_URL: http://inventory-service:8084
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  notification-service:
    build:
      context: .
      dockerfile: infrastructure/docker/service.Dockerfile
      args:
        SERVICE: notification-service
    environment:
      SERVER_PORT: 8086
      DB_HOST: postgres
      DB_NAME: notification_db
      DB_USERNAME: onestop
      DB_PASSWORD: onestop
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8086:8086"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  api-gateway:
    build:
      context: .
      dockerfile: infrastructure/docker/service.Dockerfile
      args:
        SERVICE: api-gateway
    environment:
      SERVER_PORT: 8080
      IDENTITY_URI: http://identity-service:8081
      CATALOG_URI: http://catalog-service:8082
      CART_URI: http://cart-service:8083
      ORDER_URI: http://order-service:8085
      INVENTORY_URI: http://inventory-service:8084
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      - identity-service
      - catalog-service
      - cart-service
      - order-service

volumes:
  postgres-data:
