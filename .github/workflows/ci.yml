name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test all backend services
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode --no-transfer-progress clean verify

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build production frontend
        run: npm run build

  end-to-end:
    name: Customer journey E2E
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend and browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start backend stack
        run: docker compose up --build --detach

      - name: Wait for every service
        run: |
          urls=(
            http://127.0.0.1:8080/actuator/health
            http://127.0.0.1:8081/actuator/health
            http://127.0.0.1:8082/actuator/health
            http://127.0.0.1:8083/actuator/health
            http://127.0.0.1:8084/actuator/health
            http://127.0.0.1:8085/actuator/health
            http://127.0.0.1:8086/actuator/health
          )
          for url in "${urls[@]}"; do
            ready=false
            for attempt in {1..60}; do
              if curl --fail --silent "$url" >/dev/null; then
                ready=true
                break
              fi
              sleep 2
            done
            if [[ "$ready" != true ]]; then
              echo "Service did not become ready: $url"
              docker compose ps
              exit 1
            fi
          done

      - name: Run customer journey
        working-directory: frontend
        run: npm run test:e2e

      - name: Print service logs after failure
        if: failure()
        run: docker compose logs --no-color --tail=300

      - name: Stop backend stack
        if: always()
        run: docker compose down --volumes
