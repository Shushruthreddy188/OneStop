name: Deploy production

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type deploy to confirm the production deployment'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: onestop-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy through AWS Systems Manager
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60

    steps:
      - name: Validate confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [[ "$CONFIRMATION" != "deploy" ]]; then
            echo "Deployment confirmation must be exactly: deploy" >&2
            exit 1
          fi

      - name: Show GitHub OIDC claims
        shell: bash
        run: |
          response="$(curl --fail --silent --show-error \
            --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")"
          export OIDC_TOKEN="$(jq --raw-output '.value' <<<"$response")"
          python3 - <<'PY'
          import base64
          import json
          import os

          payload = os.environ["OIDC_TOKEN"].split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          visible = {
              key: claims.get(key)
              for key in (
                  "iss",
                  "aud",
                  "sub",
                  "repository",
                  "repository_owner",
                  "environment",
                  "ref",
                  "workflow_ref",
              )
          }
          print(json.dumps(visible, indent=2, sort_keys=True))
          PY
          unset OIDC_TOKEN

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::382764426258:role/OneStopGitHubDeployRole
          aws-region: us-east-1

      - name: Run deployment on EC2
        env:
          INSTANCE_ID: i-0a17d5343ad6841f3
        run: |
          command_id="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "GitHub Actions OneStop production deployment" \
            --timeout-seconds 3600 \
            --parameters 'commands=["sudo -u ubuntu /home/ubuntu/OneStop/tools/deploy-production.sh"]' \
            --query 'Command.CommandId' \
            --output text)"

          echo "SSM command: $command_id"
          status="Pending"
          for attempt in $(seq 1 180); do
            status="$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' --output text 2>/dev/null || echo Pending)"
            echo "Deployment status: $status ($attempt/180)"
            case "$status" in
              Success|Cancelled|TimedOut|Failed|Cancelling) break ;;
            esac
            sleep 10
          done

          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Errors:StandardErrorContent}'

          if [[ "$status" != "Success" ]]; then
            echo "Production deployment failed with status: $status" >&2
            exit 1
          fi
