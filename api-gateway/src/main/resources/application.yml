server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      # Global CORS so the React app (default http://localhost:5173) can call the API.
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "${CORS_ALLOWED_ORIGINS:http://localhost:5173}"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      # Public route table (architecture doc, section 4.1). Inventory and
      # Notification are internal only and are intentionally not exposed here.
      routes:
        - id: identity-auth
          uri: ${IDENTITY_URI:http://localhost:8081}
          predicates:
            - Path=/api/auth/**
        - id: identity-users
          uri: ${IDENTITY_URI:http://localhost:8081}
          predicates:
            - Path=/api/users/**
        - id: catalog-products
          uri: ${CATALOG_URI:http://localhost:8082}
          predicates:
            - Path=/api/products/**
        - id: catalog-categories
          uri: ${CATALOG_URI:http://localhost:8082}
          predicates:
            - Path=/api/categories/**
        - id: inventory-availability
          uri: ${INVENTORY_URI:http://localhost:8084}
          predicates:
            - Path=/api/inventory/**
        - id: cart
          uri: ${CART_URI:http://localhost:8083}
          predicates:
            - Path=/api/cart/**
        - id: orders
          uri: ${ORDER_URI:http://localhost:8085}
          predicates:
            - Path=/api/orders/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      probes:
        enabled: true
