server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      # Global CORS so the React app (default http://localhost:5173) can call the API.
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "${CORS_ALLOWED_ORIGINS:http://localhost:5173}"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      # Public route table (architecture doc, section 4.1). Inventory and
      # Notification are internal only and are intentionally not exposed here.
      routes:
        - id: identity-auth
          uri: ${IDENTITY_URI:http://localhost:8081}
          predicates:
            - Path=/api/auth/**
        - id: identity-users
          uri: ${IDENTITY_URI:http://localhost:8081}
          predicates:
            - Path=/api/users/**
        - id: catalog-products
          uri: ${CATALOG_URI:http://localhost:8082}
          predicates:
            - Path=/api/products/**
        - id: catalog-categories
          uri: ${CATALOG_URI:http://localhost:8082}
          predicates:
            - Path=/api/categories/**
        - id: inventory-availability
          uri: ${INVENTORY_URI:http://localhost:8084}
          predicates:
            - Path=/api/inventory/**
        - id: search
          uri: ${SEARCH_URI:http://localhost:8087}
          predicates:
            - Path=/api/search/**
        - id: reviews
          uri: ${REVIEW_URI:http://localhost:8088}
          predicates:
            - Path=/api/reviews/**
        - id: wishlist
          uri: ${WISHLIST_URI:http://localhost:8089}
          predicates:
            - Path=/api/wishlist/**
        - id: coupons
          uri: ${COUPON_URI:http://localhost:8090}
          predicates:
            - Path=/api/coupons/**
        - id: payments
          uri: ${PAYMENT_URI:http://localhost:8091}
          predicates:
            - Path=/api/payments/**
        - id: addresses
          uri: ${ADDRESS_URI:http://localhost:8092}
          predicates:
            - Path=/api/addresses/**
        - id: deliveries
          uri: ${DELIVERY_URI:http://localhost:8093}
          predicates:
            - Path=/api/deliveries/**
        - id: admin
          uri: ${ADMIN_URI:http://localhost:8094}
          predicates:
            - Path=/api/admin/**
        - id: activity
          uri: ${ACTIVITY_URI:http://localhost:8095}
          predicates:
            - Path=/api/activity/**
        - id: recommendations
          uri: ${RECOMMENDATION_URI:http://localhost:8096}
          predicates:
            - Path=/api/recommendations/**
        - id: cart
          uri: ${CART_URI:http://localhost:8083}
          predicates:
            - Path=/api/cart/**
        - id: orders
          uri: ${ORDER_URI:http://localhost:8085}
          predicates:
            - Path=/api/orders/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
