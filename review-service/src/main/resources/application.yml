server:
  port: ${SERVER_PORT:8088}

spring:
  application:
    name: review-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:review_db}
    username: ${DB_USERNAME:onestop}
    password: ${DB_PASSWORD:onestop}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true

onestop:
  security:
    jwt:
      secret: ${JWT_SECRET:change-me-in-production-this-is-a-dev-only-256-bit-secret!!}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
