server:
  port: ${SERVER_PORT:8087}

spring:
  application:
    name: search-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:search_db}
    username: ${DB_USERNAME:onestop}
    password: ${DB_PASSWORD:onestop}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true

  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
    connection-timeout: 2s
    socket-timeout: 5s

onestop:
  security:
    internal-token: ${INTERNAL_API_TOKEN:dev-internal-token-change-me}
  clients:
    catalog:
      base-url: ${CATALOG_BASE_URL:http://localhost:8082}
    recommendation:
      base-url: ${RECOMMENDATION_BASE_URL:http://localhost:8096}
  search:
    # Query engine: "elasticsearch" (falls back to Postgres if ES is down) or "postgres".
    engine: ${SEARCH_ENGINE:postgres}
    ranking:
      # Close-the-loop feature flag: blend aggregated popularity (rank_feature)
      # into relevance ranking. Off by default.
      behavioral: ${SEARCH_BEHAVIORAL_RANKING:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
