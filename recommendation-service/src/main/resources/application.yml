server:
  port: ${SERVER_PORT:8096}

spring:
  application:
    name: recommendation-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:recommendation_db}
    username: ${DB_USERNAME:onestop}
    password: ${DB_PASSWORD:onestop}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: recommendation-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.value.default.type: com.onestop.recommendation.event.ActivityEventMessage
        spring.json.trusted.packages: "*"

onestop:
  security:
    jwt:
      secret: ${JWT_SECRET:change-me-in-production-this-is-a-dev-only-256-bit-secret!!}
  clients:
    catalog:
      base-url: ${CATALOG_BASE_URL:http://localhost:8082}
  kafka:
    topics:
      activity-events: ${ACTIVITY_EVENTS_TOPIC:activity.events}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
