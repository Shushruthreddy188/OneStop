name: onestop-prod

x-service-common: &service-common
  restart: unless-stopped
  environment: &service-environment
    DB_HOST: postgres
    DB_USERNAME: onestop
    DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    JAVA_TOOL_OPTIONS: -Xms64m -Xmx384m

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_USER: onestop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onestop"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka-native:3.9.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
      - kafka-data:/var/lib/kafka/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  identity-service:
    <<: *service-common
    build:
      context: .
      dockerfile: infrastructure/docker/service.Dockerfile
      args:
        SERVICE: identity-service
    environment:
      <<: *service-environment
      SERVER_PORT: 8081
      DB_NAME: identity_db
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.production}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env.production}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env.production}
    depends_on:
      postgres:
        condition: service_healthy

  catalog-service:
    <<: *service-common
    build:
      context: .
      dockerfile: infrastructure/docker/service.Dockerfile
      args:
        SERVICE: catalog-service
    environment:
      <<: *service-environment
      SERVER_PORT: 8082
      DB_NAME: catalog_db
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  cart-service:
    <<: *service-common
    build:
      context: .
      dockerfile: infrastructure/docker/service.Dockerfile
      args:
        SERVICE: cart-service
    environment:
      <<: *service-environment
      SERVER_PORT: 8083
      DB_NAME: cart_db
      CATALOG_BASE_URL: http://catalog-service:8082
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.production}
    depends_on:
      postgres:
        condition: service_healthy
      catalog-service:
        condition: service_started

  inventory-service:
    <<: *service-common
    build:
      context: .
      dockerfile: infrastructure/docker/service.Dockerfile
      args:
        SERVICE: inventory-service
    environment:
      <<: *service-environment
      SERVER_PORT: 8084
      DB_NAME: inventory_db
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Set INTERNAL_API_TOKEN in .env.production}
    depends_on:
      postgres:
        condition: service_healthy

  order-service:
    <<: *service-common
    build:
      context: .
      dockerfile: infrastructure/docker/service.Dockerfile
      args:
        SERVICE: order-service
    environment:
      <<: *service-environment
      SERVER_PORT: 8085
      DB_NAME: order_db
      CART_BASE_URL: http://cart-service:8083
      CATALOG_BASE_URL: http://catalog-service:8082
      INVENTORY_BASE_URL: http://inventory-service:8084
      NOTIFICATION_BASE_URL: http://notification-service:8086
      COUPON_BASE_URL: http://coupon-service:8090
      PAYMENT_BASE_URL: http://payment-service:8091
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Set INTERNAL_API_TOKEN in .env.production}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.production}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  notification-service:
    <<: *service-common
    build:
      context: .
      dockerfile: infrastructure/docker/service.Dockerfile
      args:
        SERVICE: notification-service
    environment:
      <<: *service-environment
      SERVER_PORT: 8086
      DB_NAME: notification_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Set INTERNAL_API_TOKEN in .env.production}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  search-service:
    <<: *service-common
    build: { context: ., dockerfile: infrastructure/docker/service.Dockerfile, args: { SERVICE: search-service } }
    environment:
      <<: *service-environment
      SERVER_PORT: 8087
      DB_NAME: search_db
      CATALOG_BASE_URL: http://catalog-service:8082
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Set INTERNAL_API_TOKEN in .env.production}
    depends_on:
      postgres: { condition: service_healthy }
      catalog-service: { condition: service_started }

  review-service:
    <<: *service-common
    build: { context: ., dockerfile: infrastructure/docker/service.Dockerfile, args: { SERVICE: review-service } }
    environment:
      <<: *service-environment
      SERVER_PORT: 8088
      DB_NAME: review_db
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.production}
    depends_on: { postgres: { condition: service_healthy } }

  wishlist-service:
    <<: *service-common
    build: { context: ., dockerfile: infrastructure/docker/service.Dockerfile, args: { SERVICE: wishlist-service } }
    environment:
      <<: *service-environment
      SERVER_PORT: 8089
      DB_NAME: wishlist_db
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.production}
      CATALOG_BASE_URL: http://catalog-service:8082
    depends_on:
      postgres: { condition: service_healthy }
      catalog-service: { condition: service_started }

  coupon-service:
    <<: *service-common
    build: { context: ., dockerfile: infrastructure/docker/service.Dockerfile, args: { SERVICE: coupon-service } }
    environment:
      <<: *service-environment
      SERVER_PORT: 8090
      DB_NAME: coupon_db
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Set INTERNAL_API_TOKEN in .env.production}
    depends_on: { postgres: { condition: service_healthy } }

  payment-service:
    <<: *service-common
    build: { context: ., dockerfile: infrastructure/docker/service.Dockerfile, args: { SERVICE: payment-service } }
    environment:
      <<: *service-environment
      SERVER_PORT: 8091
      DB_NAME: payment_db
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Set INTERNAL_API_TOKEN in .env.production}
    depends_on: { postgres: { condition: service_healthy } }

  address-service:
    <<: *service-common
    build: { context: ., dockerfile: infrastructure/docker/service.Dockerfile, args: { SERVICE: address-service } }
    environment:
      <<: *service-environment
      SERVER_PORT: 8092
      DB_NAME: address_db
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.production}
    depends_on: { postgres: { condition: service_healthy } }

  delivery-service:
    <<: *service-common
    build: { context: ., dockerfile: infrastructure/docker/service.Dockerfile, args: { SERVICE: delivery-service } }
    environment:
      <<: *service-environment
      SERVER_PORT: 8093
      DB_NAME: delivery_db
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.production}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_started }

  admin-service:
    <<: *service-common
    build: { context: ., dockerfile: infrastructure/docker/service.Dockerfile, args: { SERVICE: admin-service } }
    environment:
      <<: *service-environment
      SERVER_PORT: 8094
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.production}
      CATALOG_BASE_URL: http://catalog-service:8082
      ORDER_BASE_URL: http://order-service:8085
      COUPON_BASE_URL: http://coupon-service:8090
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Set INTERNAL_API_TOKEN in .env.production}
    depends_on: [catalog-service, order-service, coupon-service]

  api-gateway:
    <<: *service-common
    build:
      context: .
      dockerfile: infrastructure/docker/service.Dockerfile
      args:
        SERVICE: api-gateway
    environment:
      SERVER_PORT: 8080
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx256m
      IDENTITY_URI: http://identity-service:8081
      CATALOG_URI: http://catalog-service:8082
      CART_URI: http://cart-service:8083
      ORDER_URI: http://order-service:8085
      INVENTORY_URI: http://inventory-service:8084
      SEARCH_URI: http://search-service:8087
      REVIEW_URI: http://review-service:8088
      WISHLIST_URI: http://wishlist-service:8089
      COUPON_URI: http://coupon-service:8090
      PAYMENT_URI: http://payment-service:8091
      ADDRESS_URI: http://address-service:8092
      DELIVERY_URI: http://delivery-service:8093
      ADMIN_URI: http://admin-service:8094
      CORS_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in .env.production}
    depends_on:
      - identity-service
      - catalog-service
      - cart-service
      - inventory-service
      - order-service
      - search-service
      - review-service
      - wishlist-service
      - coupon-service
      - payment-service
      - address-service
      - delivery-service
      - admin-service

  frontend:
    build:
      context: frontend
      args:
        VITE_API_BASE_URL: /
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api-gateway

volumes:
  postgres-data:
  kafka-data:
  redis-data:
